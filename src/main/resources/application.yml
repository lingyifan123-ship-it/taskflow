spring:
  application.name: taskflow
  datasource:
    url: ${DB_URL:jdbc:h2:mem:taskflow;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql.init.mode: always
  cache.type: ${CACHE_TYPE:simple}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app.jwt:
  secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
  ttl-seconds: 7200
server.port: ${SERVER_PORT:8080}
